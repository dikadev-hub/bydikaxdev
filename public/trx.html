<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Transaksi — DikaOTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/media/logo.jpg">
</head>
<body>
<div id="nav"></div>

<div class="container dash-wrapper">
  <div class="layout">
    <aside class="sidebar glass" id="sidebar">
      <div class="sbal">
        <div class="sbal-top">
          <span><i class="fa-solid fa-wallet"></i> Saldo Akun</span>
          <i class="fa-solid fa-shield-halved" style="color:var(--mint)"></i>
        </div>
        <div class="n" data-saldo>Rp0</div>
        <div class="sbal-actions">
          <button class="btn btn-sm btn-yellow" onclick="location.href='/deposit'"><i class="fa-solid fa-plus"></i> Deposit</button>
          <button class="btn btn-sm" onclick="location.href='/nokos'"><i class="fa-solid fa-bolt"></i> Order</button>
        </div>
      </div>
      <div class="snav-title">Menu Utama</div>
      <nav class="snav-list">
        <a class="slink" href="/dashboard"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a class="slink" href="/deposit"><i class="fa-solid fa-money-bill-transfer"></i><span>Deposit Saldo</span></a>
        <a class="slink" href="/nokos"><i class="fa-solid fa-sim-card"></i><span>Beli Nokos</span></a>
        <a class="slink active" href="/trx"><i class="fa-solid fa-receipt"></i><span>Riwayat Transaksi</span></a>
        <a class="slink logout-link" href="#" onclick="GA.logout();return false"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar Akun</span></a>
      </nav>
    </aside>

    <main>
      <div class="sec-head">
        <h2><i class="fa-solid fa-receipt"></i> Riwayat Transaksi</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-yellow" data-f="ALL" onclick="setF('ALL')">Semua</button>
          <button class="btn btn-sm" data-f="ORDER" onclick="setF('ORDER')">Order</button>
          <button class="btn btn-sm" data-f="DEPOSIT" onclick="setF('DEPOSIT')">Deposit</button>
        </div>
      </div>
      <div class="glass card tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Waktu</th><th>Tipe</th><th>Detail</th><th>Nominal</th><th>Status</th></tr></thead>
          <tbody id="trxBody"><tr><td colspan="5"><div class="skel">Memuat riwayat...</div></td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div id="foot"></div>
<script src="/assets/app.js"></script>
<script>
let ALL = [], FILT = "ALL";

async function init() {
  await GA.loadConfig();
  document.getElementById("nav").innerHTML = GA.nav("trx", true);
  document.getElementById("foot").innerHTML = GA.footer();
  if (!GA.getToken()) { location.href = "/"; return; }
  await GA.refreshSaldo();
  const j = await GA.api("/api/trx");
  ALL = j.data || [];
  render();
}

function setF(f) {
  FILT = f;
  document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("btn-yellow", b.dataset.f === f));
  render();
}

function detail(t) {
  if (t.tipe === "ORDER") return `${t.layanan || ""} ${t.negara ? "· " + t.negara : ""}<br><span class="hint">+${t.nomor || ""} · ${t.orderId || ""}</span>`;
  if (t.tipe === "DEPOSIT") return `QRIS ${t.depositId || ""}`;
  if (t.tipe === "REFUND") return `Refund order ${t.orderId || ""}`;
  if (t.tipe === "SALDO_MASUK") return `Deposit ${t.depositId || ""} diterima`;
  return t.tipe;
}

function render() {
  const rows = ALL.filter(t => FILT === "ALL" || t.tipe === FILT);
  document.getElementById("trxBody").innerHTML = rows.map(t => `
    <tr>
      <td style="font-size:0.8rem;white-space:nowrap;font-weight:700">${(t.waktu || "").slice(0, 16).replace("T", " ")}</td>
      <td>${GA.statusPill(t.tipe)}</td>
      <td>${detail(t)}</td>
      <td><b>${GA.rp(t.nominal || 0)}</b></td>
      <td>${GA.statusPill(t.status)}</td>
    </tr>`).join("") || `<tr><td colspan="5"><div class="empty-state"><i class="fa-solid fa-inbox"></i>Belum ada transaksi.</div></td></tr>`;
}

init();
</script>
</body>
</html>
