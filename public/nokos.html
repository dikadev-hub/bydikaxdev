<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beli Nokos — DikaOTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/media/logo.jpg">
</head>
<body>
<div id="nav"></div>

<div class="container dash-wrapper">
  <div class="layout">
    <aside class="sidebar glass" id="sidebar">
      <div class="sbal">
        <div class="sbal-top">
          <span><i class="fa-solid fa-wallet"></i> Saldo Akun</span>
          <i class="fa-solid fa-shield-halved" style="color:var(--mint)"></i>
        </div>
        <div class="n" data-saldo>Rp0</div>
        <div class="sbal-actions">
          <button class="btn btn-sm btn-yellow" onclick="location.href='/deposit'"><i class="fa-solid fa-plus"></i> Deposit</button>
          <button class="btn btn-sm" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>
      </div>
      <div class="snav-title">Menu Utama</div>
      <nav class="snav-list">
        <a class="slink" href="/dashboard"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a class="slink" href="/deposit"><i class="fa-solid fa-money-bill-transfer"></i><span>Deposit Saldo</span></a>
        <a class="slink active" href="/nokos"><i class="fa-solid fa-sim-card"></i><span>Beli Nokos</span></a>
        <a class="slink" href="/trx"><i class="fa-solid fa-receipt"></i><span>Riwayat Transaksi</span></a>
        <a class="slink logout-link" href="#" onclick="GA.logout();return false"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar Akun</span></a>
      </nav>
    </aside>

    <main>
      <div class="sec-head">
        <h2><i class="fa-solid fa-sim-card"></i> Beli Nokos</h2>
        <span class="sticker b"><i class="fa-solid fa-satellite-dish"></i> Stok Realtime</span>
      </div>

      <div class="quick-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="glass card srv-card">
          <div class="field" style="margin:0"><label><i class="fa-solid fa-earth-asia"></i> Negara</label><select id="fCountry"><option value="">Memuat...</option></select></div>
        </div>
        <div class="glass card srv-card">
          <div class="field" style="margin:0"><label><i class="fa-solid fa-layer-group"></i> Layanan</label><select id="fService"><option value="">Pilih negara dulu</option></select></div>
        </div>
        <div class="glass card srv-card">
          <div class="field" style="margin:0"><label><i class="fa-solid fa-bag-shopping"></i> Jumlah</label><select id="fTotal"><option value="1">1 nomor</option><option value="2">2 nomor</option><option value="3">3 nomor</option><option value="5">5 nomor</option></select></div>
        </div>
      </div>

      <div class="sec-head">
        <h2><i class="fa-solid fa-server"></i> Pilih Server</h2>
        <button class="btn btn-sm" onclick="loadServers()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div class="quick-grid" id="srvList" style="grid-template-columns:repeat(3,1fr)">
        <div class="glass card skel">Memuat server...</div>
        <div class="glass card skel"></div>
        <div class="glass card skel"></div>
      </div>

      <div class="sec-head" style="margin-top:26px">
        <h2><i class="fa-solid fa-satellite-dish"></i> Orderan Aktif</h2>
        <button class="btn btn-sm" onclick="loadActive()"><i class="fa-solid fa-rotate"></i> Cek Status</button>
      </div>
      <div class="glass card tbl-wrap">
        <table class="tbl">
          <thead><tr><th><i class="fa-solid fa-hashtag"></i> ID Order</th><th><i class="fa-solid fa-phone"></i> Nomor</th><th><i class="fa-solid fa-signal"></i> Status</th><th style="text-align:right"><i class="fa-solid fa-sliders"></i> Aksi</th></tr></thead>
          <tbody id="actBody"><tr><td colspan="4"><div class="skel">Memuat orderan...</div></td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal-back" id="omodal">
  <div class="modal-box" style="text-align:center">
    <div class="modal-head">
      <h3 id="omTitle"><i class="fa-solid fa-sim-card"></i> Order</h3>
      <button class="modal-close" onclick="closeO()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="omBody"></div>
  </div>
</div>

<div id="foot"></div>
<script src="/assets/app.js"></script>
<script>
const P = new URLSearchParams(location.search);

async function init() {
  await GA.loadConfig();
  document.getElementById("nav").innerHTML = GA.nav("nok", true);
  document.getElementById("foot").innerHTML = GA.footer();
  if (!GA.getToken()) GA.openAuth();
  await GA.refreshSaldo();
  const j = await GA.api("/api/nokos/countries");
  if (!j.success) {
    document.getElementById("fCountry").innerHTML = `<option value="">Gagal memuat (${(j.error && j.error.message) || "?"})</option>`;
    return;
  }
  const want = P.get("country");
  document.getElementById("fCountry").innerHTML = `<option value="">— Pilih Negara —</option>` + (j.data || []).map(c => `<option value="${c.id}" ${String(c.id) === want ? "selected" : ""}>${c.name}</option>`).join("");
  if (want) document.getElementById("fCountry").dispatchEvent(new Event("change"));
}

async function loadServices() {
  const c = document.getElementById("fCountry").value;
  if (!c) return;
  const fsel = document.getElementById("fService");
  fsel.innerHTML = `<option value="">Memuat...</option>`;
  const j = await GA.api("/api/nokos/services?country=" + c);
  const want = P.get("service");
  fsel.innerHTML = `<option value="">— Pilih Layanan —</option>` + (j.data || []).map(s => `<option value="${s.code}" ${s.code === want ? "selected" : ""}>${s.name}</option>`).join("");
  if (want) { loadServers(); P.delete("service"); }
}

async function loadServers() {
  const c = document.getElementById("fCountry").value, s = document.getElementById("fService").value;
  const list = document.getElementById("srvList");
  list.innerHTML = `<div class="glass card skel">Memuat harga...</div>`.repeat(3);
  if (!c || !s) {
    list.innerHTML = `<div class="glass card" style="grid-column:1/-1"><p class="hint" style="margin:0">Pilih negara &amp; layanan dulu di atas.</p></div>`;
    return;
  }
  const j = await GA.api(`/api/nokos/harga?service=${s}&country=${c}`);
  if (!j.status) {
    list.innerHTML = `<div class="glass card" style="grid-column:1/-1"><p class="hint" style="margin:0"><i class="fa-solid fa-circle-exclamation"></i> ${(j.error && j.error.message) || "Gagal memuat harga"}</p></div>`;
    return;
  }
  list.innerHTML = j.server.map(v => `
    <div class="glass card srv-card">
      <div>
        <div class="srv-top">
          <div class="srv-icon"><i class="fa-solid fa-tower-cell"></i></div>
          <span class="country-tag"><i class="fa-solid fa-boxes-stacked"></i> stok ${v.stok}</span>
        </div>
        <h3>${v.label}</h3>
        <p class="hint">Tingkat OTP: <b>${v.tingkat_otp != null ? v.tingkat_otp + "%" : "N/A"}</b></p>
      </div>
      <div>
        <div style="font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;margin-bottom:10px">${GA.rp(v.harga)}</div>
        <button class="btn btn-yellow full" onclick="buy('${s}','${c}','${v.id}',${v.harga})"><i class="fa-solid fa-cart-shopping"></i> Beli Sekarang</button>
      </div>
    </div>`).join("") || `<div class="glass card" style="grid-column:1/-1"><p class="hint" style="margin:0">Tidak ada server tersedia.</p></div>`;
}

async function buy(s, c, pid, price) {
  const n = parseInt(document.getElementById("fTotal").value) || 1;
  if (!GA.getToken()) { GA.toast("Login dulu ya!", "err"); return GA.openAuth(); }
  if (!confirm(`Beli ${n} nomor (${s}) — total sekitar ${GA.rp(price * n)}?\n\nSaldo akan dipotong otomatis.`)) return;
  const url = n > 1
    ? `/api/nokos/buy-bulk?service=${s}&country=${c}&provider_id=${pid}&total=${n}`
    : `/api/nokos/buy?service=${s}&country=${c}&provider_id=${pid}&expected_price=${price}`;
  GA.toast("Memproses order...");
  const j = await GA.api(url);
  if (!j.success) return GA.toast((j.error && j.error.message) || j.message || "Order gagal", "err");
  if (n > 1) GA.toast(`Sukses ${(j.data && j.data.totalSuccess) || n}/${(j.data && j.data.totalRequested) || n} nomor! Cek daftar order aktif`, "ok");
  else GA.toast("Order sukses! Menunggu OTP...", "ok");
  GA.refreshSaldo();
  loadActive();
  loadServers();
}

async function loadActive() {
  const j = await GA.api("/api/orders/active");
  const rows = j.data || [];
  document.getElementById("actBody").innerHTML = rows.map(t => `
    <tr>
      <td><span style="font-family:monospace;font-weight:800;font-size:0.82rem;color:var(--muted-txt)">#${t.orderId}</span></td>
      <td><span class="phone-num"><i class="fa-solid fa-sim-card"></i> +${t.nomor}</span></td>
      <td>${GA.statusPill(t.status)}</td>
      <td style="text-align:right"><button class="btn btn-sm btn-yellow" onclick="openOrder('${t.orderId}')"><i class="fa-solid fa-key"></i> Cek OTP</button></td>
    </tr>`).join("") || `<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-box-open"></i>Belum ada order aktif.</div></td></tr>`;
}

let pollTm = null;

function openOrder(id) {
  document.getElementById("omodal").classList.add("show");
  document.getElementById("omTitle").innerHTML = `<i class="fa-solid fa-sim-card"></i> ${id}`;
  document.getElementById("omBody").innerHTML = `<div class="skel">Mengecek status...</div>`;
  pollStatus(id);
}

function closeO() {
  document.getElementById("omodal").classList.remove("show");
  clearTimeout(pollTm);
}

async function pollStatus(id) {
  const j = await GA.api("/api/nokos/status/" + id);
  if (!j.success) {
    document.getElementById("omBody").innerHTML = `<p class="hint"><i class="fa-solid fa-circle-exclamation"></i> ${(j.error && j.error.message) || "Gagal cek status"}</p>`;
    return;
  }
  const d = j.data || {};
  if (d.status === "COMPLETED") {
    document.getElementById("omBody").innerHTML = `
      <p class="hint">Kode OTP kamu:</p>
      <div class="otp-code">${d.otp_code || d.sms || "-"}</div>
      <p class="hint" style="margin-top:12px"><i class="fa-solid fa-circle-check" style="color:var(--mint)"></i> Sukses! Salin kode di atas untuk verifikasi.</p>
      <button class="btn btn-blue full" style="margin-top:14px" onclick="copyTxt('${d.otp_code || ""}')"><i class="fa-solid fa-copy"></i> Salin OTP</button>`;
    GA.refreshSaldo();
    loadActive();
    return;
  }
  document.getElementById("omBody").innerHTML = `
    ${GA.statusPill(d.status || "WAIT_CODE")}
    <p class="hint" style="margin:14px 0"><i class="fa-solid fa-hourglass-half"></i> ${d.status === "RESEND" ? "Menunggu SMS kedua..." : "Menunggu OTP masuk. Auto-refresh tiap 5 detik."}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-sm" onclick="doResend('${id}')"><i class="fa-solid fa-rotate"></i> Kirim Ulang</button>
      <button class="btn btn-sm" style="background:#ffc9c9" onclick="doCancel('${id}')"><i class="fa-solid fa-ban"></i> Batalkan</button>
    </div>`;
  clearTimeout(pollTm);
  pollTm = setTimeout(() => { if (document.getElementById("omodal").classList.contains("show")) pollStatus(id); }, 5000);
}

function copyTxt(t) {
  navigator.clipboard.writeText(t);
  GA.toast("Tersalin!", "ok");
}

async function doResend(id) {
  const j = await GA.api("/api/nokos/resend/" + id);
  GA.toast(j.message || (j.success ? "Resend dikirim" : "Gagal"), j.success ? "ok" : "err");
  if (j.success) pollStatus(id);
}

async function doCancel(id) {
  if (!confirm("Batalkan order ini? Saldo akan dikembalikan otomatis.")) return;
  const j = await GA.api("/api/nokos/cancel/" + id);
  GA.toast(j.message || (j.success ? "Dibatalkan" : "Gagal"), j.success ? "ok" : "err");
  if (j.success) { closeO(); GA.refreshSaldo(); loadActive(); }
}

document.getElementById("fCountry").addEventListener("change", loadServices);
document.getElementById("fService").addEventListener("change", loadServers);
document.getElementById("omodal").addEventListener("click", e => { if (e.target === document.getElementById("omodal")) closeO(); });
init();
loadActive();
</script>
</body>
</html>
